# Build with hard dependencies and public example packages only. RegR and
# ToyData are optional private Suggests; their examples check availability.
on:
  push:
    branches: [master]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write
  pages: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            any::RColorBrewer
            any::cowplot
            any::ggbeeswarm
            any::ggalluvial
            any::ggsci
            any::ggrastr
            any::gtable
            any::png
            any::ragg
            davidsjoberg/ggsankey
            any::ggupset
            any::ggVennDiagram
            any::circlize
            any::gridExtra
            any::geomtextpath
            any::plotthis
            any::VIM

      - name: Install package
        run: R CMD INSTALL --no-build-vignettes .
        shell: bash

      - name: Build site
        run: Rscript tools/build-site.R
        shell: bash

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          git-config-name: HUI950319
          git-config-email: ouyanghui950319@gmail.com
          branch: gh-pages
          folder: docs
