# Disabled. `needs: website` makes pak resolve Suggests, and two of them --
# RegR and ToyData -- are private repositories that the default GITHUB_TOKEN
# cannot read. Every run since 2026-03 died in setup-r-dependencies with
# "Can't find package called RegR, ToyData", and the site this job was meant to
# publish sat six months behind the code with nobody watching the red runs.
#
# The site is built and pushed from a workstation instead: tools/build-site.R.
#
# To bring this back, add a PAT that can read those two repositories as a
# repository secret and use it for GITHUB_PAT below, then restore the push
# trigger. Dispatching this as it stands will fail at the same step.
on:
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write
  pages: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: website

      - name: Install package
        run: R CMD INSTALL --no-build-vignettes .
        shell: bash

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
